name: Size Breadth Desk
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['collect_size_breadth.py', '.github/workflows/size_breadth.yml']
  schedule:
    # 한국시간 평일 09:30, 10:30, 13:00, 15:40, 21:30 (UTC 기준)
    - cron: '30 0,1 * * 1-5'
    - cron: '0 4 * * 1-5'
    - cron: '40 6 * * 1-5'
    - cron: '30 12 * * 1-5'
    - cron: '20 7 * * 1-5'   # 16:20 KST 종가 확정 반영
    - cron: '5 9 * * 1-5'    # 18:05 KST 종가 재확인
permissions:
  contents: write
  pages: write
concurrency:
  group: size-breadth
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/cache/restore@v4
        with:
          path: .sb-cache
          key: sb-hist-${{ github.run_id }}
          restore-keys: sb-hist-
      - run: |
          n0=$( [ -f size_breadth_log.csv ] && wc -l < size_breadth_log.csv || echo 1 )
          echo "N0=$n0" >> $GITHUB_ENV
          python collect_size_breadth.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .sb-cache
          key: sb-hist-${{ github.run_id }}
      - run: |
          git config user.name github-actions; git config user.email github-actions@github.com
          cp size_breadth.json /tmp/sb.json; tail -n +$((N0+1)) size_breadth_log.csv | grep -v "^ts," > /tmp/sblog.csv  # 이번 실행에서 새로 붙은 행만
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/sb.json size_breadth.json
            if [ -f size_breadth_log.csv ]; then cat /tmp/sblog.csv >> size_breadth_log.csv; else { echo "ts,date,market,bucket,breadth,nh,nl,n,idx_chg,grade"; cat /tmp/sblog.csv; } > size_breadth_log.csv; fi
            awk '!s[$0]++' size_breadth_log.csv > /tmp/sbdedup.csv && mv /tmp/sbdedup.csv size_breadth_log.csv  # 완전히 같은 행 중복만 제거
            python tools/check_history.py size_breadth_log.csv:ts || exit 1
            git add size_breadth.json size_breadth_log.csv
            git diff --cached --quiet && exit 0
            git commit -qm "Update size breadth desk" && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
      - name: Request Pages build
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" || true
