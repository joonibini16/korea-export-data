name: Size Breadth Desk
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['collect_size_breadth.py', '.github/workflows/size_breadth.yml']
  schedule:
    - cron: '25 0-5 * * 1-5'   # 평일 09:25~14:25 KST 매시
    - cron: '10 7 * * 1-5'     # 평일 16:10 KST 종가 확정
    - cron: '10 9 * * 1-5'     # 평일 18:10 KST 종가 누락 보완
permissions:
  contents: write
  pages: write
concurrency:
  group: size-breadth
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/cache/restore@v4
        with:
          path: .sb-cache
          key: sb-hist-${{ github.run_id }}
          restore-keys: sb-hist-
      - run: python collect_size_breadth.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .sb-cache
          key: sb-hist-${{ github.run_id }}
      - run: |
          git config user.name github-actions; git config user.email github-actions@github.com
          cp size_breadth.json /tmp/sb.json; tail -n +2 size_breadth_log.csv > /tmp/sblog.csv
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/sb.json size_breadth.json
            if [ -f size_breadth_log.csv ]; then cat /tmp/sblog.csv >> size_breadth_log.csv; else { echo "ts,date,market,bucket,breadth,nh,nl,n,idx_chg,grade"; cat /tmp/sblog.csv; } > size_breadth_log.csv; fi
            python tools/check_history.py size_breadth_log.csv:ts || exit 1
            git add size_breadth.json size_breadth_log.csv
            git diff --cached --quiet && exit 0
            git commit -qm "Update size breadth desk" && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
      - name: Request Pages build
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" || true
