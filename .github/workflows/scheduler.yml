name: Reliable scheduler (self-chaining)
# GitHub 예약(cron)은 혼잡 시 몇 시간 밀리거나 아예 건너뛴다(2026-10-19 월요일 오전 예약 전부 누락).
# 이 워크플로는 다음 실행 시각까지 작업 안에서 기다렸다가 수집 워크플로를 직접 실행(workflow_dispatch)하고,
# 끝나기 전에 자기 자신을 다시 실행해 사슬을 이어 간다. cron은 사슬이 끊겼을 때 다시 잇는 용도.
on:
  workflow_dispatch:
  schedule:
    - cron: '7 */4 * * *'
permissions:
  actions: write
  contents: read
concurrency:
  group: reliable-scheduler
  cancel-in-progress: true
jobs:
  wait-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Wait for next slot, dispatch collectors, re-chain
        env: {GH_TOKEN: '${{ github.token }}', REPO: '${{ github.repository }}'}
        run: |
          # 평일(KST) 실행표: 시각 워크플로...
          cat > /tmp/plan <<'EOF'
          08:50 etf_intraday.yml intraday_dispatch.yml
          15:45 size_breadth.yml breadth.yml breadth_naver.yml bubble.yml etf.yml corporate_spreads.yml
          15:55 foreign_buy.yml
          16:25 market_turnover.yml since_base.yml size_breadth.yml breadth.yml breadth_naver.yml bubble.yml etf.yml foreign_buy.yml sector_breadth.yml valuation.yml
          18:10 market_turnover.yml since_base.yml size_breadth.yml breadth_naver.yml foreign_buy.yml etf.yml
          21:35 size_breadth.yml breadth.yml breadth_naver.yml bubble.yml corporate_spreads.yml foreign_buy.yml etf.yml
          22:35 foreign_buy.yml
          EOF
          now=$(date +%s); best=""; bestw=""
          for d in 0 1 2 3 4 5 6 7; do
            day=$(TZ=Asia/Seoul date -d "today +$d day" +%Y-%m-%d); dow=$(TZ=Asia/Seoul date -d "$day" +%u)
            [ "$dow" -ge 6 ] && continue
            while read -r hm ws; do
              [ -z "$hm" ] && continue
              t=$(TZ=Asia/Seoul date -d "$day $hm" +%s)
              if [ "$t" -gt $((now + 30)) ]; then best=$t; bestw="$ws"; break 2; fi
            done < <(sed 's/^ *//' /tmp/plan)
          done
          wait=$((best - now)); echo "next slot $(TZ=Asia/Seoul date -d @$best '+%F %H:%M KST') in ${wait}s: $bestw"
          rechain() { gh workflow run scheduler.yml --repo "$REPO" --ref main && echo "re-chained"; }
          if [ "$wait" -gt 20400 ]; then sleep 20400; rechain; exit 0; fi
          sleep "$wait"
          for w in $bestw; do gh workflow run "$w" --repo "$REPO" --ref main && echo "$(TZ=Asia/Seoul date +%H:%M) dispatched $w" || echo "fail $w"; sleep 3; done
          sleep 60
          rechain
