name: Hanyang Vietnam Imports
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [collect_hanyang_imports.py, collect_hanyang_segments.py, build_hanyang_import_comparison.py, .github/workflows/hanyang_imports.yml]
  schedule:
    - cron: '45 12 * * *'
permissions:
  contents: write
concurrency:
  group: hanyang-vietnam-imports
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install lxml
      - uses: actions/cache@v4
        with:
          path: .history-cache
          key: hanyang-product-filings-${{ github.run_id }}
          restore-keys: hanyang-product-filings-
      - name: Collect validated import rows
        env:
          CUSTOMS_API_KEY: ${{ secrets.CUSTOMS_API_KEY }}
        run: python collect_hanyang_imports.py
      - name: Extract correctly dated product revenue and compare
        run: |
          python collect_hanyang_segments.py
          python build_hanyang_import_comparison.py
          python build_hanyang_vietnam.py
      - name: Save imports without changing export sources
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add hanyang_vietnam_imports.csv hanyang_vietnam_import_status.json hanyang_product_revenue.csv hanyang_product_revenue_status.json hanyang_import_comparison.json hanyang_import_comparison_quarterly.csv hanyang_vietnam.json hanyang_vietnam_monthly.csv hanyang_vietnam_quarterly.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Vietnam memory imports for Hanyang comparison"
          git pull --rebase origin main
          git push origin main
