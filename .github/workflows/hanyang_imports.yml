name: Hanyang Vietnam Imports
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [collect_hanyang_imports.py, .github/workflows/hanyang_imports.yml]
  schedule:
    - cron: '45 12 15-20 * *'
permissions:
  contents: write
concurrency:
  group: hanyang-vietnam-imports
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Collect validated import rows
        env:
          CUSTOMS_API_KEY: ${{ secrets.CUSTOMS_API_KEY }}
        run: python collect_hanyang_imports.py
      - name: Save imports without changing export sources
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add hanyang_vietnam_imports.csv hanyang_vietnam_import_status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Vietnam memory imports for Hanyang comparison"
          git pull --rebase origin main
          git push origin main
