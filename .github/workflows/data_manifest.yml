name: Data Update Times
on:
  workflow_dispatch:
  push:
    branches: [main]
  workflow_run:
    workflows: ["All Export Data", "Quarterly Backlog Refresh", "Market Breadth Data", "Korea Market Breadth (Naver fallback)", "Bubble Monitor Data", "Backfill Quarterly Company History", "Consensus Trend (revisions)", "Theme ETF Board", "Forecast Snapshot", "KRW/TWD-USD Exchange Rate", "Quarterly Inventory", "Japan Exports (e-Stat)", "Naver Consensus Snapshot", "Price Indicators", "Provisional Export Dashboard", "Regional Company Exports", "Korea Sector Breadth", "Company Segments (product/segment revenue & OP)", "Size Breadth Desk", "Taiwan Monthly Revenue", "Customs Export Data", "Valuation Data (prices, shares, EPS consensus)"]
    types: [completed]
  schedule:
    - cron: '23 */2 * * *'   # 예비: 2시간마다
permissions:
  contents: write
  pages: write
concurrency:
  group: data-manifest
  cancel-in-progress: false
jobs:
  stamp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: |
          git config user.name github-actions; git config user.email github-actions@github.com
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 tools/data_manifest.py
            git add data_updated.json
            git diff --cached --quiet && exit 0
            git commit -qm "Update data update-times manifest" && git push -q origin HEAD:main && exit 0
            sleep 8
          done
          exit 1
      - name: Request Pages build
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" || true
