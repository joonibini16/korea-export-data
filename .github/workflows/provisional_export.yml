name: Provisional Export Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * *'
  push:
    branches:
      - main
    paths:
      - 'collect_provisional_official.py'
      - '.github/workflows/provisional_export.yml'

permissions:
  contents: write

concurrency:
  group: provisional-export-dashboard
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Collect official provisional releases
        run: python collect_provisional_official.py
      - name: Commit new provisional data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add provisional_official.csv
          if git diff --cached --quiet; then
            echo "새 잠정치 없음"
          else
            git commit -m "Update official provisional export data"
            git pull --rebase origin main
            git push origin main
          fi
