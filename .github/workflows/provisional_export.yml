name: Provisional Export Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '30 1,4,7 * * *' # KST 10:30, 13:30, 16:30
  push:
    branches:
      - main
    paths:
      - 'collect_provisional_official.py'
      - '.github/workflows/provisional_export.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: provisional-export-dashboard
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Collect official provisional releases
        run: python collect_provisional_official.py
      - name: Commit new provisional data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add provisional_official.csv
          if git diff --cached --quiet; then
            echo "새 잠정치 없음"
          else
            git commit -m "Update official provisional export data"
            git pull --rebase origin main
            git push origin main
          fi
      # GITHUB_TOKEN commits do not start a Pages build; deploy explicitly.
      - name: Prepare dashboard files
        run: |
          mkdir -p _site
          cp index.html provisional.html hs_codes.csv summary_all.csv country_all.csv provisional_official.csv provisional_hs.csv _site/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
