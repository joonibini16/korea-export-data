name: Consensus Trend (revisions)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['collect_consensus_trend.py', '.github/workflows/consensus_trend.yml']
  schedule:
    - cron: '40 23 * * 0-4'   # 평일 08:40 KST: 매일 시점 스냅샷을 쌓아 상향·하향 흐름을 추적
permissions:
  contents: write
concurrency:
  group: consensus-trend
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python collect_consensus_trend.py
      - run: |
          git config user.name github-actions; git config user.email github-actions@github.com
          cp consensus_trend_new.csv /tmp/new.csv; cp consensus_trend_status.json /tmp/status.json
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            python collect_consensus_trend.py --merge /tmp/new.csv && cp /tmp/status.json consensus_trend_status.json
            git add consensus_trend.csv consensus_trend_status.json
            git diff --cached --quiet && exit 0
            git commit -qm "Update consensus trend" && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
