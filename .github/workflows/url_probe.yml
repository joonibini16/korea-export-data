name: URL Probe (review)
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'space-separated URLs'
        required: true
      maxlen:
        description: 'max chars kept per body'
        required: false
        default: '300000'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/url_probe.py
        env:
          URLS: ${{ inputs.urls }}
          MAXLEN: ${{ inputs.maxlen }}
      - run: |
          git config user.name github-actions; git config user.email github-actions@github.com
          cp url_probe.json /tmp/p.json; git checkout -q --orphan probe-output; git rm -rq --cached .; cp /tmp/p.json url_probe.json
          git add url_probe.json; git commit -qm "url probe"; git push -qf origin HEAD:probe-output
