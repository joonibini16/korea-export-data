name: Korea Market Breadth (Naver fallback)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['collect_breadth_naver.py', '.github/workflows/breadth_naver.yml']
  schedule:
    # 한국시간 평일 09:30, 10:30, 13:00, 15:40, 20:40, 21:30 (UTC 기준)
    - cron: '30 0,1 * * 1-5'
    - cron: '0 4 * * 1-5'
    - cron: '40 6 * * 1-5'
    - cron: '40 11 * * 1-5'
    - cron: '30 12 * * 1-5'
permissions:
  contents: write
concurrency:
  group: breadth-naver
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas
      - run: python collect_breadth_naver.py
      - run: |
          git config user.name github-actions; git config user.email github-actions@github.com
          for f in breadth_kr.csv breadth_naver_status.json breadth_db_proxy.json; do if [ -f $f ]; then git add $f; fi; done
          if ! git diff --cached --quiet; then
            git commit -m "Update Korea market breadth"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if python -c 'import json,subprocess,sys; from pathlib import Path; remote=json.loads(subprocess.check_output(["git","show","origin/main:breadth_naver_status.json"])); local=json.loads(Path("breadth_naver_status.json").read_text()); sys.exit(0 if remote.get("updated_at","") > local.get("updated_at","") else 1)'; then
                echo "Newer breadth data already published; keeping remote."
                exit 0
              fi
              # This commit changes generated breadth files only. Keep the newer
              # collection when their data/status lines overlap during rebase.
              git rebase -X theirs origin/main || { git rebase --abort; exit 1; }
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 3))
            done
            echo "Push contention persisted; collected data were not published."
            exit 1
          fi
