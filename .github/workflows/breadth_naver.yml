name: Korea Market Breadth (Naver fallback)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['collect_breadth_naver.py', '.github/workflows/breadth_naver.yml']
  schedule:
    # 한국시간 평일 09:30, 10:30, 13:00, 15:40, 21:30 (UTC 기준)
    - cron: '30 0,1 * * 1-5'
    - cron: '0 4 * * 1-5'
    - cron: '40 6 * * 1-5'
    - cron: '30 12 * * 1-5'
permissions:
  contents: write
concurrency:
  group: breadth-naver
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas
      - run: python collect_breadth_naver.py
      - run: |
          git config user.name github-actions; git config user.email github-actions@github.com
          for f in breadth_kr.csv breadth_naver_status.json; do if [ -f $f ]; then git add $f; fi; done
          if ! git diff --cached --quiet; then git commit -m "Update Korea market breadth"; git pull --rebase origin main || (git rebase --abort; exit 1); git push; fi
