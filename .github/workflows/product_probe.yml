name: Product table probe (review)
on:
  workflow_dispatch:
    inputs:
      companies: {description: 'ids', required: true}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install lxml
      - run: python tools/product_probe.py ${{ inputs.companies }}
      - run: |
          git config user.name github-actions; git config user.email github-actions@github.com
          cp product_probe.json /tmp/p.json; git checkout -q --orphan probe-output; git rm -rq --cached .; cp /tmp/p.json product_probe.json
          git add product_probe.json; git commit -qm "product probe"; git push -qf origin HEAD:probe-output
