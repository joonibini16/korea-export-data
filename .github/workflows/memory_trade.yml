name: Memory Module and SSD Trade Weights
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [collect_memory_trade.py, build_memory_trade.py, memory_trade_config.json, .github/workflows/memory_trade.yml]
  schedule:
    - cron: '30 12 * * *'
permissions:
  contents: write
concurrency:
  group: memory-trade-weights
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Collect both trade directions and preserve verified rows
        env:
          CUSTOMS_API_KEY: ${{ secrets.CUSTOMS_API_KEY }}
        run: python collect_memory_trade.py
      - name: Validate calendar periods and build weight indicators
        run: python build_memory_trade.py
      - name: Save changed trade datasets
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add memory_trade_raw.csv memory_trade_collection_status.json memory_trade.json memory_trade_monthly.csv memory_trade_quarterly.csv memory_trade_flow_validation.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update memory module and SSD trade weights"
          git pull --rebase origin main
          git push origin main
