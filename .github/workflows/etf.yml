name: Theme ETF Board
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['collect_etf.py', 'etf_watchlist.json', '.github/workflows/etf.yml']
  schedule:
    - cron: '35 3 * * 1-5'    # 평일 12:35 KST (장중 점검)
    - cron: '45 6 * * 1-5'    # 평일 15:45 KST (장 마감 후 확정)
    - cron: '10 9 * * 1-5'    # 평일 18:10 KST (종가 수집 보완)
permissions:
  contents: write
  pages: write
concurrency:
  group: etf-board
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python collect_etf.py
      - run: |
          git config user.name github-actions; git config user.email github-actions@github.com
          cp etf_board.json /tmp/etf_board.json
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/etf_board.json etf_board.json
            git add etf_board.json
            git diff --cached --quiet && exit 0
            git commit -qm "Update theme ETF board" && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
      - name: Request Pages build
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" || true
