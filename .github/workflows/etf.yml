name: Theme ETF Board
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['collect_etf.py', 'etf_watchlist.json', '.github/workflows/etf.yml']
  schedule:
    # GitHub 예약 실행은 혼잡 시 몇 시간씩 밀리거나 건너뛰는 경우가 있어 여러 번 겹쳐 둠(같은 날 여러 번 돌아도 결과는 같음)
    - cron: '35 1,2,3,4,5 * * 1-5'   # 평일 10:35~14:35 KST 매시 (장중)
    - cron: '45 6 * * 1-5'           # 평일 15:45 KST (장 마감 후 확정)
    - cron: '17 7,8,9,11,13 * * 1-5' # 평일 16:17~22:17 KST (종가 수집 보완·재시도)
permissions:
  contents: write
  pages: write
concurrency:
  group: etf-board
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python collect_etf.py
      - run: |
          git config user.name github-actions; git config user.email github-actions@github.com
          cp etf_board.json /tmp/etf_board.json
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/etf_board.json etf_board.json
            git add etf_board.json
            git diff --cached --quiet && exit 0
            git commit -qm "Update theme ETF board" && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
      - name: Request Pages build
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" || true
