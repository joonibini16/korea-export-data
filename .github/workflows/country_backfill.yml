name: Country Backfill Only

on:
  workflow_dispatch:
  push:
    branches:
      - fix/customs-retry-csv-preservation-20260915
    paths:
      - '.github/workflows/country_backfill.yml'

permissions:
  contents: write

concurrency:
  group: customs-export-data
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: '1'
      CUSTOMS_REQUEST_INTERVAL: '3'
      CUSTOMS_MAX_REQUESTS: '500'
    steps:
      - name: 저장소 파일 가져오기
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 필요한 라이브러리 설치
        run: python -m pip install requests

      - name: 데이터 보존 회귀 테스트
        id: verify
        run: python -m unittest discover -s tests -v

      - name: 국가별 미수집만 백필
        id: country
        continue-on-error: true
        env:
          CUSTOMS_API_KEY: ${{ secrets.CUSTOMS_API_KEY }}
          CUSTOMS_REQUIRE_FRESH_TOTALS: '0'
          CUSTOMS_COUNTRY_EMPTY_AS_ZERO: '1'
          CUSTOMS_COUNTRY_FAILED_ONLY: '1'
        run: python country_test.py

      - name: 검증된 국가별 CSV 저장
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'country_*.csv'
          if git diff --cached --quiet; then
            echo "국가별 CSV 변경사항 없음"
          else
            git commit -m "Backfill remaining country customs data"
            git pull --rebase origin "$TARGET_BRANCH"
            git push origin "HEAD:$TARGET_BRANCH"
          fi

      - name: 실행 결과 보관
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: country-backfill-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            country_*.csv
          if-no-files-found: ignore
          retention-days: 30

      - name: 백필 미완료를 실패로 표시
        if: ${{ !cancelled() && steps.country.outcome == 'failure' }}
        run: |
          echo "국가별 미수집 백필이 남아 있습니다. 다음 실행에서 이어서 처리합니다."
          exit 1
