name: Valuation Data (prices, shares, EPS consensus)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['collect_valuation.py', '.github/workflows/valuation.yml']
  schedule:
    - cron: '0 8 * * 1'
    - cron: '0 8 1 * *'
permissions:
  contents: write
concurrency:
  group: valuation
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python collect_valuation.py
      - run: |
          git config user.name github-actions; git config user.email github-actions@github.com
          git add stock_prices_monthly.csv stock_shares.csv valuation_consensus.csv valuation_status.json
          if ! git diff --cached --quiet; then git commit -m "Update valuation data"; git pull --rebase origin main || (git rebase --abort; exit 1); git push; fi
