name: KRW/TWD-USD Exchange Rate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['collect_fx.py', '.github/workflows/fx.yml']
  schedule:
    - cron: '20 0 * * 1'
    - cron: '20 0 2,16 * *'
permissions:
  contents: write
jobs:
  fx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python collect_fx.py
      - run: |
          git config user.name github-actions; git config user.email github-actions@github.com
          git add fx_krw_usd.csv fx_twd_usd.csv
          if ! git diff --cached --quiet; then git commit -m "Update KRW/USD rate"; git pull --rebase origin main || (git rebase --abort; exit 1); git push; fi
