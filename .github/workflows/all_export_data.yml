name: All Export Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 16 * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: 저장소 파일 가져오기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 필요한 프로그램 설치
        run: pip install requests

      - name: 전체 품목 수출데이터 수집
        env:
          CUSTOMS_API_KEY: ${{ secrets.CUSTOMS_API_KEY }}
        run: python test.py

      - name: 국가별 수출데이터 수집
        env:
          CUSTOMS_API_KEY: ${{ secrets.CUSTOMS_API_KEY }}
        run: python country_test.py

      - name: CSV 파일 GitHub에 저장
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add export_*.csv
          git add summary_*.csv
          git add latest.csv
          git add country_*.csv

          git commit -m "Update all export data" || echo "변경사항 없음"
          git push
