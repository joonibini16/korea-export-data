name: All Export Data

on:
  workflow_dispatch:
  schedule:
    # UTC 01:00 = Korea 10:00, every month on the 15th.
    - cron: '0 1 15 * *'

permissions:
  contents: write

# The same group serializes all three collectors, including manual runs.
concurrency:
  group: customs-export-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: '1'
      CUSTOMS_REQUEST_INTERVAL: '3'
      CUSTOMS_MAX_REQUESTS: '500'
    steps:
      - name: 저장소 파일 가져오기
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 필요한 라이브러리 설치
        run: python -m pip install requests

      - name: 데이터 보존 회귀 테스트
        id: verify
        run: python -m unittest discover -s tests -v

      - name: 전체 품목 수출데이터 수집
        id: collect
        continue-on-error: true
        env:
          CUSTOMS_API_KEY: ${{ secrets.CUSTOMS_API_KEY }}
        run: |
          set +e
          python test.py
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: 국가별 수출데이터 수집
        id: country
        if: ${{ steps.collect.outputs.exit_code == '0' || steps.collect.outputs.exit_code == '1' }}
        continue-on-error: true
        env:
          CUSTOMS_API_KEY: ${{ secrets.CUSTOMS_API_KEY }}
          CUSTOMS_REQUIRE_FRESH_TOTALS: '0'
          CUSTOMS_COUNTRY_EMPTY_AS_ZERO: '1'
        run: python country_test.py

      - name: 검증된 CSV와 오류 기록 저장
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'export_*.csv' 'summary_*.csv' latest.csv 'country_*.csv'
          if git diff --cached --quiet; then
            echo "CSV 변경사항 없음"
          else
            git commit -m "Update validated customs data and collection diagnostics"
            # 실행 중 브랜치에 다른 커밋이 생겨도 비-패스트포워드로 데이터 저장이 실패하지 않도록 최신 커밋 위에 재배치한다.
            git pull --rebase origin "$TARGET_BRANCH"
            git push origin "HEAD:$TARGET_BRANCH"
          fi

      - name: 실행 결과 보관
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: customs-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            export_*.csv
            summary_*.csv
            latest.csv
            country_*.csv
          if-no-files-found: ignore
          retention-days: 30

      - name: 수집 미완료를 실패로 표시
        if: ${{ !cancelled() && (steps.collect.outcome == 'failure' || steps.country.outcome == 'failure' || steps.country.outcome == 'skipped') }}
        run: |
          echo "수집 미완료: 오류 CSV와 각 단계 로그를 확인하세요."
          exit 1
