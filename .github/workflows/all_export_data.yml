name: All Export Data

on:
  workflow_dispatch:

  schedule:
    - cron: '0 1 15 * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: all-export-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      # =====================================================
      # 1. 저장소 가져오기
      # =====================================================

      - name: 저장소 파일 가져오기
        uses: actions/checkout@v4


      # =====================================================
      # 2. Python 설치
      # =====================================================

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'


      # =====================================================
      # 3. 필요한 라이브러리 설치
      # =====================================================

      - name: 필요한 프로그램 설치
        run: |
          pip install requests


      # =====================================================
      # 4. 전체 품목 수출입 데이터 수집
      # test.py
      # =====================================================

      - name: 전체 품목 수출데이터 수집
        env:
          CUSTOMS_API_KEY: ${{ secrets.CUSTOMS_API_KEY }}
          TIME_BUDGET_MIN: '150'
        run: |
          python test.py

      - name: 품목 수집분 중간 저장
        if: always()
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@github.com"
          git add export_*.csv summary_*.csv latest.csv country_*.csv *_progress.txt 2>/dev/null || true
          git commit -qm "Update all export data" || echo "변경사항 없음"
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q && exit 0; sleep $((i*5)); done; exit 1


      # =====================================================
      # 5. 국가별 수출데이터 수집
      # country_test.py
      # =====================================================

      - name: 국가별 수출데이터 수집
        env:
          CUSTOMS_API_KEY: ${{ secrets.CUSTOMS_API_KEY }}
          TIME_BUDGET_MIN: '150'
        run: |
          python country_test.py


      # =====================================================
      # 6. 생성된 CSV 파일 GitHub에 저장
      # =====================================================

      - name: CSV 파일 GitHub에 저장 (최종)
        if: always()
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@github.com"
          git add export_*.csv summary_*.csv latest.csv country_*.csv *_progress.txt 2>/dev/null || true
          git commit -qm "Update all export data" || echo "변경사항 없음"
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q && exit 0; sleep $((i*5)); done; exit 1

      - name: 남은 품목이 있으면 이어서 다시 실행
        if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          if grep -qs incomplete export_progress.txt country_progress.txt; then
            gh workflow run all_export_data.yml --repo "$GITHUB_REPOSITORY" --ref main && echo "다음 실행 예약"
          fi
