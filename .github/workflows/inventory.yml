name: Quarterly Inventory
on:
  workflow_dispatch:
    inputs:
      companies:
        description: 'space-separated ids (empty = all)'
        default: ''
  push:
    branches: [main]
    paths: ['collect_inventory.py', '.github/workflows/inventory.yml']
  schedule:
    - cron: '30 1 20 2,3,5,8,11 *'   # after quarterly/annual report deadlines
concurrency:
  group: inventory
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install lxml
      - uses: actions/cache/restore@v4
        with:
          path: .history-cache
          key: company-history-inv-${{ github.run_id }}
          restore-keys: company-history-
      - run: python collect_inventory.py ${{ inputs.companies }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .history-cache
          key: company-history-inv-${{ github.run_id }}
      - name: Commit
        run: |
          git config user.name github-actions; git config user.email github-actions@github.com
          git add company_inventory.csv company_inventory_status.json
          if ! git diff --cached --quiet; then git commit -m "Update quarterly inventory"; git pull --rebase origin main; git push; fi
      - name: Request Pages build
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" || true
