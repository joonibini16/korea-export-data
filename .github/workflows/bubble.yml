name: Bubble Monitor Data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['collect_bubble.py', '.github/workflows/bubble.yml']
  schedule:
    # GitHub 예약 실행 지연·누락 대비로 겹쳐 둠(같은 날 여러 번 돌아도 덮어쓰기라 무해)
    - cron: '30 22 * * 0-4'          # 07:30 KST (미국 장 마감 반영)
    - cron: '40 2 * * 1-5'           # 11:40 KST (장중)
    - cron: '42 6,7 * * 1-5'         # 15:42·16:42 KST (국내 장 마감 종가)
    - cron: '30 9,12 * * 1-5'        # 18:30·21:30 KST (재시도)
permissions:
  contents: write
concurrency:
  group: bubble
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python collect_bubble.py
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
      - run: |
          git config user.name github-actions; git config user.email github-actions@github.com
          for f in market_daily.csv fred_data.csv bubble_status.json ecos_rates.csv vkospi.csv kofia_daily.csv; do if [ -f $f ]; then git add $f; fi; done
          if ! git diff --cached --quiet; then git commit -m "Update bubble monitor data"; git pull --rebase origin main || (git rebase --abort; exit 1); git push; fi
