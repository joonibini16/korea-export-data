name: Country API Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      - name: 저장소 파일 가져오기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: requests 설치
        run: pip install requests

      - name: 국가별 데이터 수집
        env:
          CUSTOMS_API_KEY: ${{ secrets.CUSTOMS_API_KEY }}
        run: python country_test.py

      - name: 국가별 CSV 저장
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add country_*.csv
          git commit -m "Update country export data" || echo "변경사항 없음"
          git push
