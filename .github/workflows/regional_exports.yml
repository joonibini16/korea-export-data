name: Regional Company Exports
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['collect_regional_exports.py', 'company_watchlist.json', '.github/workflows/regional_exports.yml']
  schedule:
    - cron: '30 2 15,16,20 * *'
permissions:
  contents: write
  pages: write
concurrency:
  group: regional-company-exports
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect and validate regional exports
        id: collect
        continue-on-error: true
        env:
          CUSTOMS_API_KEY: ${{ secrets.CUSTOMS_API_KEY }}
        run: python collect_regional_exports.py
      - name: Preserve validated data and collection status
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add regional_status.json
          if test -f regional_exports.csv; then git add regional_exports.csv; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update validated regional exports and coverage"
            git pull --rebase origin main
            git push
          fi
      - name: Request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Report incomplete collection
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'Regional collection incomplete; inspect regional_status.json. Existing data retained.'
          exit 1
