name: Segment Table Dump (review)
on:
  workflow_dispatch:
    inputs:
      companies: {description: 'space-separated ids (empty = all)', default: ''}
      last: {description: 'recent reports per company', default: '3'}
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install lxml
      - uses: actions/cache/restore@v4
        with:
          path: .history-cache
          key: company-history-seg-${{ github.run_id }}
          restore-keys: company-history-
      - run: python tools/segment_dump.py ${{ inputs.companies }} --last=${{ inputs.last }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .history-cache
          key: company-history-seg-${{ github.run_id }}
      - run: |
          git config user.name github-actions; git config user.email github-actions@github.com
          cp segment_dump.json /tmp/s.json
          git checkout -q --orphan segment-dump; git rm -rq --cached .; cp /tmp/s.json segment_dump.json
          git add segment_dump.json; git commit -qm "segment dump"; git push -qf origin HEAD:segment-dump
