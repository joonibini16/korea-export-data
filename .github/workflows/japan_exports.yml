name: Japan Exports (e-Stat)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['collect_japan_exports.py', 'japan_items.json', '.github/workflows/japan_exports.yml']
  schedule:
    # MOF releases monthly 確報 near month-end (09:30 JST); retry on the 1st and 5th
    - cron: '50 2 29 * *'
    - cron: '50 2 1,5 * *'
permissions:
  contents: write
  pages: write
concurrency:
  group: japan-exports
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect Japan exports
        id: collect
        continue-on-error: true
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: python collect_japan_exports.py
      - name: Commit data and status
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add japan_exports_status.json || true
          if test -f japan_exports.csv; then git add japan_exports.csv; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update Japan exports"
            git pull --rebase origin main
            git push
          fi
      - name: Request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" || true
      - name: Report incomplete collection
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'Japan export collection incomplete; see japan_exports_status.json.'
          exit 1
