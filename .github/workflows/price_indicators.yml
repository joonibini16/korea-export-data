name: Price Indicators
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/collect_price_indicators.py', '.github/workflows/price_indicators.yml']
  schedule:
    - cron: '37 1 * * *'     # 매일 10:37 KST (OpenRouter 전일 확정·GPU 시세)
    - cron: '47 7 * * *'     # 매일 16:47 KST (DRAMeXchange 오후 세션 반영)
permissions:
  contents: write
  pages: write
concurrency:
  group: price-indicators
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/collect_price_indicators.py
      - run: |
          git config user.name github-actions; git config user.email github-actions@github.com
          cp price_indicators_log.csv price_indicators_status.json /tmp/
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/price_indicators_log.csv /tmp/price_indicators_status.json .
            git add price_indicators_log.csv price_indicators_status.json
            git diff --cached --quiet && exit 0
            git commit -qm "Update price indicators" && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
      - name: Request Pages build
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" || true
