name: Price Indicators
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/collect_price_indicators.py', 'tools/collect_bigtech_bonds.py', 'bigtech_bonds.json', 'bigtech_bonds_manual.csv', '.github/workflows/price_indicators.yml']
  schedule:
    # 예약 실행 누락 대비로 여러 번 겹쳐 둠(결과는 날짜별 덮어쓰기라 중복 무해)
    - cron: '37 1,3,5 * * *'   # 매일 10:37·12:37·14:37 KST (OpenRouter 전일 확정·GPU 시세)
    - cron: '47 7,10,14 * * *' # 매일 16:47·19:47·23:47 KST (DRAMeXchange 오후 세션·FINRA 갱신)
permissions:
  contents: write
  pages: write
concurrency:
  group: price-indicators
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/collect_price_indicators.py
      - run: python tools/collect_bigtech_bonds.py
        continue-on-error: true
      - run: |
          git config user.name github-actions; git config user.email github-actions@github.com
          cp price_indicators_log.csv price_indicators_status.json /tmp/; cp bigtech_bonds_hist.csv bigtech_bonds_status.json /tmp/ 2>/dev/null || true
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/price_indicators_log.csv /tmp/price_indicators_status.json .; cp /tmp/bigtech_bonds_hist.csv /tmp/bigtech_bonds_status.json . 2>/dev/null || true
            git add price_indicators_log.csv price_indicators_status.json; git add bigtech_bonds_hist.csv bigtech_bonds_status.json 2>/dev/null || true
            git diff --cached --quiet && exit 0
            git commit -qm "Update price indicators" && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
      - name: Request Pages build
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" || true
