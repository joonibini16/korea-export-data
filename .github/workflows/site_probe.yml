name: Site Probe (review)
on:
  workflow_dispatch:
    inputs:
      companies:
        description: 'id:name pairs'
        required: true
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install lxml
      - run: python tools/site_probe.py ${{ inputs.companies }}
      - name: Publish to backlog-work branch
        run: |
          git config user.name github-actions; git config user.email github-actions@github.com
          cp site_probe.json /tmp/p.json; git checkout -q --orphan backlog-work; git rm -rq --cached .; cp /tmp/p.json site_probe.json
          git add site_probe.json; git commit -qm "site probe"; git push -qf origin backlog-work
