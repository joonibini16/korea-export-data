name: Company Segments (product/segment revenue & OP)
on:
  workflow_dispatch:
    inputs:
      companies: {description: 'space-separated ids (empty = all)', default: ''}
      commit: {description: 'commit results (yes/no)', default: 'yes'}
  schedule:
    - cron: '30 22 * * 1'   # 매주 화 07:30 KST (새 정기보고서 반영)
permissions:
  contents: write
  pages: write
concurrency:
  group: segments
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install lxml
      - uses: actions/cache/restore@v4
        with:
          path: .history-cache
          key: company-history-segments-${{ github.run_id }}
          restore-keys: company-history-
      - run: python collect_segments.py ${{ inputs.companies }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .history-cache
          key: company-history-segments-${{ github.run_id }}
      - name: Publish for review
        run: |
          git config user.name github-actions; git config user.email github-actions@github.com
          mkdir -p /tmp/o; cp company_segments.csv company_segments_status.json /tmp/o/
          if [ "${{ inputs.commit }}" = "no" ]; then
            git checkout -q --orphan segment-out; git rm -rq --cached .; cp /tmp/o/* .; git add company_segments.csv company_segments_status.json; git commit -qm "segments review"; git push -qf origin HEAD:segment-out; exit 0
          fi
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main; cp /tmp/o/* .
            git add company_segments.csv company_segments_status.json
            git diff --cached --quiet && exit 0
            git commit -qm "Update company segments" && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
      - name: Request Pages build
        if: inputs.commit != 'no'
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" || true
