name: Market Breadth Data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['collect_breadth.py', '.github/workflows/breadth.yml']
  schedule:
    # 예약 실행 지연·누락 대비로 겹쳐 둠
    - cron: '45 22 * * 0-4'
    - cron: '52 6,7 * * 1-5'         # 15:52·16:52 KST (장 마감 후)
    - cron: '45 9,12 * * 1-5'        # 18:45·21:45 KST (재시도)
permissions:
  contents: write
concurrency:
  group: breadth
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/cache/restore@v4
        with:
          path: .breadth-cache
          key: breadth-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: breadth-v1-
      - run: python -m unittest test_breadth.py
      - run: python collect_breadth.py
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .breadth-cache
          key: breadth-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: breadth-data
          path: |
            breadth_daily.json
            breadth_status.json
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add breadth_daily.json breadth_status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update market breadth observations"
            git pull --rebase origin main
            git push
          fi
