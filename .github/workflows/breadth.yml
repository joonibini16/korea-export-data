name: Korea Market Breadth
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['collect_breadth.py', '.github/workflows/breadth.yml']
  schedule:
    - cron: '50 7 * * 1-5'   # 16:50 KST, 장 마감 후
permissions:
  contents: write
concurrency:
  group: breadth
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas
      - run: python collect_breadth.py
      - run: |
          git config user.name github-actions; git config user.email github-actions@github.com
          for f in breadth_kr.csv breadth_status.json; do if [ -f $f ]; then git add $f; fi; done
          if ! git diff --cached --quiet; then git commit -m "Update Korea market breadth"; git pull --rebase origin main || (git rebase --abort; exit 1); git push; fi
