name: Company Products (product revenue & prices)
on:
  workflow_dispatch:
    inputs:
      companies: {description: 'space-separated ids (empty = all)', default: ''}
      debug: {description: 'dump candidate grids (yes/no)', default: 'no'}
      commit: {description: 'commit results (yes/no)', default: 'yes'}
  schedule:
    - cron: '50 22 * * 1'   # 매주 화 07:50 KST
permissions:
  contents: write
  pages: write
concurrency:
  group: products
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install lxml
      - uses: actions/cache/restore@v4
        with:
          path: .history-cache
          key: company-history-products-${{ github.run_id }}
          restore-keys: company-history-
      - run: python collect_products.py ${{ inputs.companies }} ${{ inputs.debug == 'yes' && '--debug' || '' }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .history-cache
          key: company-history-products-${{ github.run_id }}
      - name: Publish for review
        run: |
          git config user.name github-actions; git config user.email github-actions@github.com
          mkdir -p /tmp/o; cp company_products.csv company_prices.csv company_products_status.json /tmp/o/; [ -f segment_debug.json ] && cp segment_debug.json /tmp/o/ || true
          if [ "${{ inputs.commit }}" = "no" ]; then
            git checkout -q --orphan product-out; git rm -rq --cached .; cp /tmp/o/* .; git add company_products.csv company_prices.csv company_products_status.json; [ -f segment_debug.json ] && git add segment_debug.json; git commit -qm "products review"; git push -qf origin HEAD:product-out; exit 0
          fi
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main; cp /tmp/o/* .
            git add company_products.csv company_prices.csv company_products_status.json
            git diff --cached --quiet && exit 0
            git commit -qm "Update company products and prices" && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
      - name: Request Pages build
        if: inputs.commit != 'no'
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" || true
