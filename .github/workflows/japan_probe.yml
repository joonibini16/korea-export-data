name: Japan e-Stat Probe
on:
  workflow_dispatch:
    inputs:
      args:
        description: 'probe arguments'
        default: 'list 輸出'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
          ARGS: ${{ inputs.args }}
        run: |
          test -n "$ESTAT_APP_ID" || { echo 'ESTAT_APP_ID missing'; exit 1; }
          eval "set -- $ARGS"; python tools/estat_probe.py "$@" > probe_out.txt 2>&1 || true
          git config user.name github-actions; git config user.email github-actions@github.com
          git checkout -q --orphan probe-output; git rm -rq --cached .; git add probe_out.txt
          git commit -qm "probe: $ARGS"; git push -qf origin probe-output
