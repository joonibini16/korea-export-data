name: Active ETF holdings (PDF) daily — after market close only
on:
  workflow_dispatch:
    inputs:
      pdf_from: {description: '과거 채우기 시작일 (YYYY-MM-DD)', required: false, default: ''}
      list_active: {description: '국내 액티브 ETF 후보 목록만 저장(1)', required: false, default: ''}
      list_pat: {description: '후보 목록 이름 정규식(선택)', required: false, default: ''}
permissions:
  contents: write
concurrency:
  group: etf-pdf
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q requests
      - run: python tools/collect_etf_pdf.py
        continue-on-error: true
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          PDF_FROM: ${{ github.event.inputs.pdf_from }}
          LIST_ACTIVE: ${{ github.event.inputs.list_active }}
          LIST_PAT: ${{ github.event.inputs.list_pat }}
      - env:
          LIST_ACTIVE: ${{ github.event.inputs.list_active }}
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/ep && cp -r etf_pdf etf_pdf_status.json /tmp/ep/ 2>/dev/null || true; cp etf_active_candidates.json /tmp/ep/ 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            if [ -n "$LIST_ACTIVE" ]; then cp /tmp/ep/etf_active_candidates.json . 2>/dev/null || true; git add etf_active_candidates.json; git diff --cached --quiet && exit 0; git commit -qm "Active ETF candidates" && git push -q origin HEAD:main && exit 0; sleep $((i*4)); continue; fi
            cp -r /tmp/ep/etf_pdf . 2>/dev/null; cp /tmp/ep/etf_pdf_status.json . 2>/dev/null || true
            git add etf_pdf etf_pdf_status.json 2>/dev/null; git add etf_active_candidates.json 2>/dev/null; git diff --cached --quiet && exit 0
            git commit -qm "Update active ETF holdings" && git push -q origin HEAD:main && exit 0; sleep $((i*4))
          done; exit 1
