name: Naver Consensus Snapshot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['collect_consensus.py', '.github/workflows/naver_consensus.yml']
  schedule:
    - cron: '20 23 * * 0'   # every Monday 08:20 KST
concurrency:
  group: naver-consensus
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install lxml
      - name: Snapshot consensus
        id: collect
        continue-on-error: true
        run: python collect_consensus.py
      - name: Commit
        run: |
          git config user.name github-actions; git config user.email github-actions@github.com
          git add naver_consensus_status.json
          if test -f naver_consensus.csv; then git add naver_consensus.csv; fi
          if ! git diff --cached --quiet; then git commit -m "Update Naver consensus snapshot"; git pull --rebase origin main; git push; fi
      - name: Request Pages build
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" || true
      - if: steps.collect.outcome == 'failure'
        run: exit 1
