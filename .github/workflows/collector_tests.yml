name: Collector Regression Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: python -m unittest discover -s tests -v
      - name: Verify tracked CSV files are unchanged
        run: git diff --exit-code -- '*.csv'
