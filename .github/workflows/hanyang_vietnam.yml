name: Hanyang Vietnam Export Tracker
on:
  workflow_dispatch:
  workflow_run:
    workflows: [All Export Data]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'country_8542321010.csv'
      - 'country_8542321030.csv'
      - 'country_8473304060.csv'
      - 'country_8523511000.csv'
      - 'country_8542323000.csv'
      - 'country_854232.csv'
      - 'country_853400.csv'
      - 'company_financials.csv'
      - 'hs_codes.csv'
      - 'hanyang_vietnam_config.json'
      - 'build_hanyang_vietnam.py'
  schedule:
    - cron: '30 12 * * *'
permissions:
  contents: write
concurrency:
  group: hanyang-vietnam-export
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source data and rebuild tracker
        run: python build_hanyang_vietnam.py
      - name: Save changed derived files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hanyang_vietnam.json hanyang_vietnam_monthly.csv hanyang_vietnam_quarterly.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Hanyang Vietnam export tracker"
          git pull --rebase origin main
          git push origin HEAD:main
