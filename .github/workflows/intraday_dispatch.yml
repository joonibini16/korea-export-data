name: Intraday dispatcher (breadth · bubble)
# GitHub 예약 실행(cron)은 혼잡 시 몇 시간씩 밀리거나 건너뛰므로, 한 번 시작되면 장 마감 후까지
# 20분마다 각 수집 워크플로를 직접 실행(workflow_dispatch, 예약보다 즉시 실행됨)한다.
on:
  workflow_dispatch:
  schedule:
    - cron: '52 23 * * 0-4'  # 평일 08:52 KST 시작
    - cron: '16 0 * * 1-5'   # 09:16 KST (앞선 시작 누락 대비)
    - cron: '44 1 * * 1-5'   # 10:44 KST
    - cron: '9 3 * * 1-5'    # 12:09 KST
    - cron: '36 4 * * 1-5'   # 13:36 KST
permissions:
  actions: write
  contents: read
concurrency:
  group: intraday-dispatch
  cancel-in-progress: false
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Dispatch collectors every 20 minutes until 16:10 KST
        env: {GH_TOKEN: '${{ github.token }}', REPO: '${{ github.repository }}'}
        run: |
          end=$(TZ=Asia/Seoul date -d 'today 16:10' +%s)
          while :; do
            now=$(date +%s)
            for w in size_breadth.yml breadth.yml breadth_naver.yml bubble.yml; do
              gh workflow run "$w" --repo "$REPO" --ref main && echo "$(TZ=Asia/Seoul date +%H:%M) dispatched $w" || echo "fail $w"
              sleep 5
            done
            [ "$now" -ge "$end" ] && break
            sleep 1200
          done
