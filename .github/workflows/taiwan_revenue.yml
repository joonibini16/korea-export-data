name: Taiwan Monthly Revenue
on:
  workflow_dispatch:
    inputs:
      full:
        description: 'Re-download every month from 2015.01'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['collect_taiwan_revenue.py', 'taiwan_watchlist.json', '.github/workflows/taiwan_revenue.yml']
  schedule:
    # 대만 기업은 매월 1~10일에 전월 매출을 공시(마감 10일) → 1~16일 매일 두 번 수집해 공시되는 대로 반영
    # 10:40 KST(전날 저녁 공시분) · 19:10 KST(당일 장 마감 후 공시분)
    - cron: '40 1 1-16 * *'
    - cron: '10 10 1-16 * *'
permissions:
  contents: write
  pages: write
  actions: write
concurrency:
  group: taiwan-monthly-revenue
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect Taiwan monthly revenue (MOPS)
        id: collect
        continue-on-error: true
        run: python collect_taiwan_revenue.py ${{ inputs.full && '--full' || '' }}
      - name: Commit data and status
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add taiwan_revenue_status.json
          if test -f taiwan_backfill.json; then git add taiwan_backfill.json; fi
          if test -f taiwan_monthly_revenue.csv; then git add taiwan_monthly_revenue.csv; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update Taiwan monthly revenue"
            git pull --rebase origin main
            git pull --rebase origin main || (git rebase --abort; exit 1)
            git push
          fi
      - name: Continue backfill if pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test -f taiwan_backfill.json && python -c "import json,sys;sys.exit(0 if json.load(open('taiwan_backfill.json')).get('pending') else 1)"; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/taiwan_revenue.yml/dispatches" -f ref=main || true
          fi
      - name: Request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" || true
      - name: Report incomplete collection
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'Taiwan revenue collection incomplete; see taiwan_revenue_status.json. Existing data retained.'
          exit 1
