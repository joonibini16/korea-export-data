name: Verify Company Financial Coverage
on:
  push:
    paths:
      - 'company_financial*.csv'
      - 'company_financial*.json'
      - 'company_watchlist.json'
      - 'build_company_financials.py'
      - '.github/workflows/financial_coverage.yml'
  pull_request:
    paths:
      - 'company_financial*.csv'
      - 'company_financial*.json'
      - 'company_watchlist.json'
      - 'build_company_financials.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify quarterly continuity and annual reconciliation
        run: python build_company_financials.py --check
