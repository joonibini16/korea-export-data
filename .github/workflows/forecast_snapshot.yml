name: Forecast Snapshot
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Naver Consensus Snapshot', 'Regional Company Exports']
    types: [completed]
  schedule:
    - cron: '50 23 * * 0'   # Monday 08:50 KST (after consensus refresh)
concurrency:
  group: forecast-snapshot
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --no-package-lock jsdom@24
      - name: Freeze today's forecasts and consensus
        run: node tools/snapshot_forecasts.cjs
      - name: Commit
        run: |
          git config user.name github-actions; git config user.email github-actions@github.com
          git add forecast_log.csv
          if ! git diff --cached --quiet; then git commit -m "Forecast snapshot $(date -u +%F)"; git pull --rebase origin main; git push; fi
      - name: Request Pages build
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" || true
