name: Foreign Buy Ranking
on:
  workflow_dispatch:
    inputs:
      backfill_from: {description: '과거 자료를 이 날짜(YYYY-MM-DD)까지 채움', required: false, default: ''}
      max_days: {description: '한 번에 받을 최대 일수', required: false, default: '70'}
  push:
    branches: [main]
    paths: ['collect_foreign_buy.py', 'build_flow_oscillator.py', '.github/workflows/foreign_buy.yml']
  schedule:
    # 한국시간 평일 15:50, 16:20, 18:10, 20:40, 21:30, 22:30
    # 20시 장 종료 이후 KRX 최종치 지연에 대비해 21:30/22:30 재조회
    - cron: '50 6 * * 1-5'
    - cron: '20 7 * * 1-5'
    - cron: '10 9 * * 1-5'
    - cron: '40 11 * * 1-5'
    - cron: '30 12 * * 1-5'
    - cron: '30 13 * * 1-5'
permissions:
  contents: write
concurrency:
  group: foreign-buy
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q requests
      - run: python collect_foreign_buy.py
        continue-on-error: true
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          BACKFILL_FROM: ${{ github.event.inputs.backfill_from }}
          MAX_DAYS: ${{ github.event.inputs.max_days || '70' }}
      - run: python build_flow_oscillator.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add foreign_buy.json foreign_buy_hist.csv foreign_buy_status.json foreign_buy_periods.json foreign_buy_series.json foreign_buy_days invest_days inst_buy_periods.json inst_buy_series.json trust_buy_periods.json trust_buy_series.json pe_buy_periods.json pe_buy_series.json fi_buy_periods.json fi_buy_series.json corp_buy_periods.json corp_buy_series.json pension_buy_periods.json pension_buy_series.json core_buy_periods.json core_buy_series.json flow_oscillator.json flow_stocks.json flow_oscillator_core.json flow_stocks_core.json 2>/dev/null || git add foreign_buy_status.json
          if ! git diff --cached --quiet; then
            git commit -qm "Update foreign buy ranking"
            for attempt in 1 2 3 4 5; do
              git pull -q --rebase -X theirs origin main || { git rebase --abort || true; exit 1; }
              if git push -q origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi
