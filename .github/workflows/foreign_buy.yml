name: Foreign Buy Ranking
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['collect_foreign_buy.py', '.github/workflows/foreign_buy.yml']
  schedule:
    # 한국시간 평일 15:50, 16:20, 18:10, 20:40 (장 마감 후 확정치, 지연 대비 중복)
    - cron: '50 6 * * 1-5'
    - cron: '20 7 * * 1-5'
    - cron: '10 9 * * 1-5'
    - cron: '40 11 * * 1-5'
permissions:
  contents: write
concurrency:
  group: foreign-buy
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q requests
      - run: python collect_foreign_buy.py
        continue-on-error: true
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add foreign_buy.json foreign_buy_hist.csv foreign_buy_status.json 2>/dev/null || git add foreign_buy_status.json
          git diff --cached --quiet || (git commit -qm "Update foreign buy ranking" && git pull -q --rebase origin main && git push -q origin main)
