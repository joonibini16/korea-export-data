<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>해외 분기 실적 리포트</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./shell.css?v=3"><script src="./shell.js?v=30" defer></script>
<style>
main{max-width:1220px;margin:24px auto;padding:0 22px 0 62px}
.gr-top h1{margin:0 0 6px;font-size:26px}.gr-top p{margin:0 0 14px;color:#93a3bd;font-size:13.5px;line-height:1.6}
.gr-tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid #22314f;margin-bottom:12px}
.gr-tabs button{background:none;border:0;border-bottom:3px solid transparent;color:#93a3bd;padding:10px 14px;font-size:15px;font-weight:700;cursor:pointer}
.gr-tabs button.on{color:#1a2440!important;background:#e8dcc0!important;border-color:#e8dcc0!important}.gr-tabs button.on small{color:#5a4a20!important}
.gr-tabs button small{font-weight:400;font-size:12px;margin-left:6px;color:#7f8fa9}
.gr-co{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 18px}
.gr-co button{background:#13223b;color:#e2e8f0;border:1px solid #34476a;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.gr-co button.on{background:#e8dcc0;color:#1a2440;border-color:#e8dcc0;font-weight:700}
.gr-co button .rich{display:inline-block;width:6px;height:6px;border-radius:50%;background:#c9a24a;margin-left:6px;vertical-align:middle}
.gr-sec{display:flex;gap:8px;flex-wrap:wrap;margin:-8px 0 14px}.gr-sec select{background:#0b1426;color:#edf3ff;border:1px solid #51607a;border-radius:8px;padding:7px 9px;font-size:13px}
/* 리포트 본문: 밝은 지면 */
.paper{--ink:#1a2440;--ink2:#4a5674;--line:#e3e6ec;--gold:#a8812f;--navy:#1d2b4f;--blue:#1f5fa8;--soft:#f6f7f9;--red:#c0392b;--up:#c0392b;--down:#1f5fa8;
 background:#fff!important;color:var(--ink)!important;border-radius:6px;padding:40px 46px 46px;font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;line-height:1.75}
.paper *{color:inherit}
.paper .mono{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
.paper .kicker{font-family:"JetBrains Mono",monospace;color:var(--gold);font-size:12.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase}
.paper .title{font-size:36px;line-height:1.25;margin:10px 0 12px;color:var(--navy)}
.paper .meta{font-family:"JetBrains Mono",monospace;font-size:12.5px;color:#7a8499;padding-bottom:20px;border-bottom:2px solid var(--navy);margin-bottom:8px}
.paper .meta a{color:var(--blue)}
.paper .verdict{display:inline-block;font-family:"JetBrains Mono",monospace;font-size:12px;border:1px solid currentColor;border-radius:4px;padding:1px 8px;margin-left:8px}
.paper .verdict.up{color:var(--up)}.paper .verdict.down{color:var(--down)}.paper .verdict.flat{color:#9a7b1f}
.paper h3.sec{display:flex;align-items:baseline;gap:12px;font-size:23px;color:var(--navy);margin:38px 0 18px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.paper h3.sec .no{font-family:"JetBrains Mono",monospace;color:var(--gold);font-size:15px}
.paper h4{color:var(--blue);font-size:18px;margin:26px 0 12px}
.paper p{margin:0 0 12px;font-size:15.5px}
.paper .call{background:var(--soft);border-left:4px solid var(--gold);padding:16px 22px;margin:16px 0;border-radius:0 4px 4px 0}
.paper .call.blue{background:#eff5fc;border-left-color:var(--blue)}.paper .call.red{background:#fdf3f2;border-left-color:var(--red)}
.paper .call b.h{display:block;font-weight:600;margin-bottom:6px;font-size:15px}
.paper .call p:last-child,.paper .call ul:last-child{margin-bottom:0}
.paper .kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:6px 0 16px}
.paper .kpi{border:1px solid var(--line);background:#f8f9fb;border-radius:3px;padding:18px 20px}
.paper .kpi .l{font-size:13px;color:#7a8499}.paper .kpi .v{font-family:"JetBrains Mono",monospace;font-size:26px;font-weight:600;color:var(--navy);margin:8px 0 6px;letter-spacing:-.01em}
.paper .kpi .s{font-family:"JetBrains Mono",monospace;font-size:12px;color:#6b7590}.paper .kpi.up .s{color:var(--up)}.paper .kpi.down .s{color:var(--down)}
.paper .tw{overflow-x:auto;margin:6px 0 10px}
.paper table{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
.paper thead th{background:var(--navy);color:#fff!important;text-align:left;font-weight:600;padding:13px 16px;font-family:"Noto Serif KR",serif;white-space:nowrap}
.paper tbody td{padding:12px 16px;border-bottom:1px solid var(--line);font-family:"Noto Sans KR",sans-serif;font-size:13.5px;vertical-align:top;line-height:1.6}
.paper tbody td.n{font-family:"JetBrains Mono",monospace;font-size:13px;white-space:nowrap}
.paper tbody tr:last-child td{border-bottom:1px solid #cfd4dd}
.paper .note{font-size:13.5px;color:var(--ink2);margin:4px 0 14px}
.paper .num{color:var(--blue);font-weight:600}.paper .pos{color:var(--up);font-weight:600}.paper .neg{color:var(--down);font-weight:600}
.paper ul.sq{list-style:none;padding:0;margin:4px 0}.paper ul.sq li{position:relative;padding-left:20px;margin:6px 0;font-size:15px}.paper ul.sq li:before{content:"";position:absolute;left:2px;top:.75em;width:6px;height:6px;background:var(--navy)}
.paper blockquote{margin:12px 0 4px;padding:14px 20px;border-left:4px solid var(--red);background:#fdf6f5;font-style:italic;font-size:16px}
.paper .who{font-family:"JetBrains Mono",monospace;font-size:11.5px;letter-spacing:.08em;color:#6b7590;text-transform:uppercase;margin:6px 0 14px}
.paper .src{font-size:12.5px;color:#7a8499;margin-top:34px;padding-top:14px;border-top:1px solid var(--line);line-height:1.8}
.paper .src a{color:var(--blue)}
.paper .lite{font-size:13px;color:#7a8499;font-family:"Noto Sans KR",sans-serif}
@media(max-width:900px){main{padding:0 22px}}@media(max-width:760px){main{padding:0 12px}.paper{padding:24px 18px 30px}.paper .title{font-size:27px}.paper .kpis{grid-template-columns:1fr}.paper h3.sec{font-size:20px}}
</style></head>
<body><main>
<section class="gr-top"><h1>해외 분기 실적 리포트</h1>
<p class="muted">관찰 목록 기업의 분기 실적을 회사 공식 IR 자료만으로 정리한 리포트입니다. 위 탭에서 실적 시즌(분기)을, 아래에서 기업을 고르세요. 금색 점이 있는 기업은 핵심 지표 카드·표까지 갖춘 상세 리포트이고, 나머지는 검증 기록을 같은 양식으로 보여 줍니다. 시장 컨센서스는 회사 자료가 아니므로 싣지 않습니다. <a href="./global_earnings.html">실적·컨콜 변곡점 보기</a></p></section>
<div class="gr-tabs" id="qtabs" role="tablist" aria-label="실적 시즌"></div>
<div class="gr-sec"><select id="sector" aria-label="업종"><option value="">전체 업종</option></select></div>
<div class="gr-co" id="cotabs" aria-label="기업"></div>
<article class="paper" id="paper"><p class="lite">불러오는 중…</p></article>
</main>
<script src="./global_earnings_report.js?v=1" defer></script>
</body></html>
