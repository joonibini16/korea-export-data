<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate">

<meta http-equiv="Pragma"
      content="no-cache">

<meta http-equiv="Expires"
      content="0">


<title>한국 수출 데이터 모니터링</title>


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


<style>

body {

    font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;

    margin: 0;

    background: #f5f6f8;

    color: #222;

}


.container {

    width: 94%;

    max-width: 1400px;

    margin: 25px auto;

}


h1 {

    margin-bottom: 5px;

}


.subtitle {

    color: #666;

    margin-bottom: 25px;

}


/* ==============================
   상단 카드
============================== */

.cards {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(230px, 1fr)
        );

    gap: 15px;

    margin-bottom: 25px;

}


.card {

    background: white;

    border-radius: 12px;

    padding: 20px;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.08);

    cursor: pointer;

    transition: 0.2s;

}


.card:hover {

    transform:
        translateY(-3px);

    box-shadow:
        0 4px 14px rgba(0,0,0,0.13);

}


.card.active {

    outline:
        2px solid #666;

}


.item-name {

    font-size: 18px;

    font-weight: bold;

}


.amount {

    font-size: 29px;

    font-weight: bold;

    margin-top: 10px;

}


.change {

    margin-top: 10px;

    font-size: 14px;

}


.unit-price {

    margin-top: 9px;

    font-size: 14px;

    color: #555;

}


.positive {

    color: #d33;

    font-weight: bold;

}


.negative {

    color: #1677ff;

    font-weight: bold;

}


/* ==============================
   그래프 박스
============================== */

.chart-box {

    background: white;

    padding: 20px;

    border-radius: 12px;

    margin-bottom: 20px;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.08);

}


.chart-title {

    margin-top: 0;

    margin-bottom: 20px;

}


.main-chart {

    position: relative;

    height: 470px;

}


.change-chart {

    position: relative;

    height: 280px;

}


/* ==============================
   표
============================== */

.table-wrapper {

    overflow-x: auto;

}


table {

    width: 100%;

    border-collapse: collapse;

    background: white;

}


th,
td {

    padding: 12px;

    border-bottom:
        1px solid #e5e5e5;

}


th {

    background: #f3f4f6;

    text-align: center;

}


td.number {

    text-align: right;

}


td.center {

    text-align: center;

}


@media (max-width: 700px) {

    .main-chart {

        height: 380px;

    }

    .change-chart {

        height: 260px;

    }

}

</style>

</head>



<body>


<div class="container">


<h1>
한국 수출 데이터 모니터링
</h1>


<div
    class="subtitle"
    id="latestMonth">

    데이터 불러오는 중...

</div>



<!-- ===========================
     품목 카드
=========================== -->

<div
    class="cards"
    id="cards">
</div>



<!-- ===========================
     수출액 + 수출단가
=========================== -->

<div class="chart-box">

<h2
    class="chart-title"
    id="mainChartTitle">

    월별 수출액 및 수출단가

</h2>


<div class="main-chart">

<canvas
    id="mainChart">
</canvas>

</div>

</div>



<!-- ===========================
     YoY + MoM
=========================== -->

<div class="chart-box">

<h2 class="chart-title">

    수출 증감률

</h2>


<div class="change-chart">

<canvas
    id="changeChart">
</canvas>

</div>

</div>



<!-- ===========================
     최신 수출 현황
=========================== -->

<div class="chart-box">


<h2 class="chart-title">

    최신 수출 현황

</h2>


<div class="table-wrapper">

<table>


<thead>

<tr>

<th>
품목
</th>

<th>
HS Code
</th>

<th>
수출액
</th>

<th>
YoY
</th>

<th>
MoM
</th>

<th>
수출단가
</th>

</tr>

</thead>


<tbody
    id="latestTable">
</tbody>


</table>

</div>

</div>


</div>



<script>


let allData = [];

let mainChart = null;

let changeChart = null;

let selectedItem = null;


/* ==============================================
   CSV 불러오기
============================================== */

async function loadCSV() {


    const response =
        await fetch(
            "summary_all.csv?t="
            +
            Date.now()
        );


    const text =
        await response.text();


    const rows =
        text
        .trim()
        .split(/\r?\n/);


    const headers =
        rows[0]
        .split(",")
        .map(
            x =>
                x.trim()
        );


    allData =
        rows
        .slice(1)

        .filter(
            row =>
                row.trim() !== ""
        )

        .map(
            row => {


                const values =
                    row.split(",");


                let obj = {};


                headers.forEach(
                    (
                        header,
                        index
                    ) => {


                        obj[header] =
                            values[index]
                            ?
                            values[index]
                            .trim()
                            :
                            "";


                    }
                );


                return obj;


            }
        );


    createDashboard();

}



/* ==============================================
   수출액 표시
============================================== */

function formatMoney(
    value
) {


    const num =
        Number(value);


    if (
        num >= 1000000000
    ) {


        return (
            "$"
            +
            (
                num
                /
                1000000000
            )
            .toFixed(2)
            +
            "B"
        );


    }


    if (
        num >= 1000000
    ) {


        return (
            "$"
            +
            (
                num
                /
                1000000
            )
            .toFixed(1)
            +
            "M"
        );


    }


    return (
        "$"
        +
        num.toLocaleString()
    );

}



/* ==============================================
   퍼센트 표시
============================================== */

function formatPercent(
    value
) {


    if (
        value === ""
        ||
        value === undefined
        ||
        value === null
    ) {


        return "-";


    }


    const num =
        Number(value);


    if (
        num > 0
    ) {


        return (
            "+"
            +
            num.toFixed(1)
            +
            "%"
        );


    }


    return (
        num.toFixed(1)
        +
        "%"
    );

}



/* ==============================================
   플러스/마이너스 색상
============================================== */

function percentClass(
    value
) {


    const num =
        Number(value);


    if (
        num > 0
    ) {

        return "positive";

    }


    if (
        num < 0
    ) {

        return "negative";

    }


    return "";

}



/* ==============================================
   대시보드 시작
============================================== */

function createDashboard() {


    if (
        !allData
        ||
        allData.length === 0
    ) {


        document
        .getElementById(
            "latestMonth"
        )
        .innerText =
            "데이터가 없습니다.";


        return;

    }


    const months =
        allData
        .map(
            d =>
                d["월"]
        );


    const latestMonth =
        [...months]
        .sort()
        .reverse()[0];


    document
    .getElementById(
        "latestMonth"
    )
    .innerText =
        "최신 데이터: "
        +
        latestMonth;


    const latest =
        allData
        .filter(
            d =>
                d["월"]
                ===
                latestMonth
        );


    createCards(
        latest
    );


    createLatestTable(
        latest
    );


    if (
        latest.length > 0
    ) {


        selectItem(
            latest[0]["품목명"]
        );


    }

}



/* ==============================================
   상단 품목 카드
============================================== */

function createCards(
    data
) {


    const container =
        document
        .getElementById(
            "cards"
        );


    container.innerHTML =
        "";


    data.forEach(
        item => {


            const card =
                document
                .createElement(
                    "div"
                );


            card.className =
                "card";


            card.dataset.item =
                item["품목명"];


            card.innerHTML =
            `

            <div class="item-name">

                ${item["품목명"]}

            </div>


            <div class="amount">

                ${formatMoney(
                    item[
                        "수출금액_USD"
                    ]
                )}

            </div>


            <div class="change">

                YoY:

                <span
                    class="${percentClass(
                        item["YoY_pct"]
                    )}">

                    ${formatPercent(
                        item["YoY_pct"]
                    )}

                </span>

                &nbsp;&nbsp;

                MoM:

                <span
                    class="${percentClass(
                        item["MoM_pct"]
                    )}">

                    ${formatPercent(
                        item["MoM_pct"]
                    )}

                </span>

            </div>


            <div class="unit-price">

                수출단가

                <strong>

                    $${Number(
                        item[
                            "수출단가_USD_per_KG"
                        ]
                    )
                    .toFixed(2)}
                    /kg

                </strong>

            </div>

            `;


            card.onclick =
                () => {


                    selectItem(
                        item[
                            "품목명"
                        ]
                    );


                };


            container
            .appendChild(
                card
            );


        }
    );

}



/* ==============================================
   품목 선택
============================================== */

function selectItem(
    itemName
) {


    selectedItem =
        itemName;


    document
    .querySelectorAll(
        ".card"
    )
    .forEach(
        card => {


            card
            .classList
            .toggle(
                "active",
                card.dataset.item
                ===
                itemName
            );


        }
    );


    createMainChart(
        itemName
    );


    createChangeChart(
        itemName
    );

}



/* ==============================================
   최신 현황 표
============================================== */

function createLatestTable(
    data
) {


    const tbody =
        document
        .getElementById(
            "latestTable"
        );


    tbody.innerHTML =
        "";


    data.forEach(
        item => {


            const tr =
                document
                .createElement(
                    "tr"
                );


            tr.innerHTML =
            `

            <td>

                ${item["품목명"]}

            </td>


            <td class="center">

                ${item["HS코드"]}

            </td>


            <td class="number">

                ${Number(
                    item[
                        "수출금액_USD"
                    ]
                )
                .toLocaleString()}

            </td>


            <td class="number">

                <span
                    class="${percentClass(
                        item["YoY_pct"]
                    )}">

                    ${formatPercent(
                        item["YoY_pct"]
                    )}

                </span>

            </td>


            <td class="number">

                <span
                    class="${percentClass(
                        item["MoM_pct"]
                    )}">

                    ${formatPercent(
                        item["MoM_pct"]
                    )}

                </span>

            </td>


            <td class="number">

                $${Number(
                    item[
                        "수출단가_USD_per_KG"
                    ]
                )
                .toFixed(2)}
                /kg

            </td>

            `;


            tbody
            .appendChild(
                tr
            );


        }
    );

}



/* ==============================================
   메인 그래프

   막대 = 수출액
   선   = 수출단가

   왼쪽축 = 수출액
   오른쪽축 = 수출단가
============================================== */

function createMainChart(
    itemName
) {


    const data =
        allData

        .filter(
            d =>
                d["품목명"]
                ===
                itemName
        )

        .sort(
            (
                a,
                b
            ) =>
                a["월"]
                .localeCompare(
                    b["월"]
                )
        );


    const labels =
        data
        .map(
            d =>
                d["월"]
        );


    const exportValues =
        data
        .map(
            d =>

                Number(
                    d[
                        "수출금액_USD"
                    ]
                )

                /

                1000000
        );


    const unitPriceValues =
        data
        .map(
            d =>

                Number(
                    d[
                        "수출단가_USD_per_KG"
                    ]
                )
        );


    document
    .getElementById(
        "mainChartTitle"
    )
    .innerText =
        itemName
        +
        " 수출액 및 수출단가";


    if (
        mainChart
    ) {


        mainChart
        .destroy();


    }


    const ctx =
        document
        .getElementById(
            "mainChart"
        );


    mainChart =
        new Chart(
            ctx,
            {


                data: {


                    labels:
                        labels,


                    datasets: [


                        {

                            type:
                                "bar",

                            label:
                                "수출액 (백만 USD)",

                            data:
                                exportValues,

                            yAxisID:
                                "yExport",

                            borderWidth:
                                0

                        },


                        {

                            type:
                                "line",

                            label:
                                "수출단가 (USD/kg)",

                            data:
                                unitPriceValues,

                            yAxisID:
                                "yPrice",

                            tension:
                                0.25,

                            pointRadius:
                                1.5,

                            pointHoverRadius:
                                5

                        }


                    ]


                },


                options: {


                    responsive:
                        true,


                    maintainAspectRatio:
                        false,


                    interaction: {

                        mode:
                            "index",

                        intersect:
                            false

                    },


                    plugins: {


                        legend: {

                            position:
                                "top"

                        },


                        tooltip: {


                            callbacks: {


                                label:
                                    function(
                                        context
                                    ) {


                                        if (
                                            context
                                            .dataset
                                            .yAxisID
                                            ===
                                            "yExport"
                                        ) {


                                            return (
                                                "수출액: $"
                                                +
                                                context
                                                .parsed
                                                .y
                                                .toLocaleString(
                                                    undefined,
                                                    {
                                                        maximumFractionDigits:
                                                            1
                                                    }
                                                )
                                                +
                                                "M"
                                            );


                                        }


                                        return (
                                            "수출단가: $"
                                            +
                                            context
                                            .parsed
                                            .y
                                            .toFixed(2)
                                            +
                                            "/kg"
                                        );


                                    }


                            }


                        }


                    },


                    scales: {


                        yExport: {


                            type:
                                "linear",

                            position:
                                "left",

                            beginAtZero:
                                true,


                            title: {

                                display:
                                    true,

                                text:
                                    "수출액 (백만 USD)"

                            },


                            ticks: {


                                callback:
                                    function(
                                        value
                                    ) {


                                        return (
                                            "$"
                                            +
                                            Number(
                                                value
                                            )
                                            .toLocaleString()
                                            +
                                            "M"
                                        );


                                    }


                            }


                        },


                        yPrice: {


                            type:
                                "linear",

                            position:
                                "right",

                            beginAtZero:
                                false,


                            title: {

                                display:
                                    true,

                                text:
                                    "수출단가 (USD/kg)"

                            },


                            grid: {

                                drawOnChartArea:
                                    false

                            },


                            ticks: {


                                callback:
                                    function(
                                        value
                                    ) {


                                        return (
                                            "$"
                                            +
                                            Number(
                                                value
                                            )
                                            .toFixed(1)
                                        );


                                    }


                            }


                        },


                        x: {


                            grid: {

                                display:
                                    false

                            },


                            ticks: {

                                maxRotation:
                                    45,

                                minRotation:
                                    45,

                                autoSkip:
                                    true,

                                maxTicksLimit:
                                    24

                            }


                        }


                    }


                }


            }
        );

}



/* ==============================================
   YoY + MoM 그래프
============================================== */

function createChangeChart(
    itemName
) {


    const data =
        allData

        .filter(
            d =>
                d["품목명"]
                ===
                itemName
        )

        .sort(
            (
                a,
                b
            ) =>
                a["월"]
                .localeCompare(
                    b["월"]
                )
        );


    const labels =
        data.map(
            d =>
                d["월"]
        );


    const yoyValues =
        data.map(
            d => {


                if (
                    d["YoY_pct"]
                    ===
                    ""
                ) {

                    return null;

                }


                return Number(
                    d["YoY_pct"]
                );


            }
        );


    const momValues =
        data.map(
            d => {


                if (
                    d["MoM_pct"]
                    ===
                    ""
                ) {

                    return null;

                }


                return Number(
                    d["MoM_pct"]
                );


            }
        );


    if (
        changeChart
    ) {


        changeChart
        .destroy();


    }


    const ctx =
        document
        .getElementById(
            "changeChart"
        );


    changeChart =
        new Chart(
            ctx,
            {


                type:
                    "line",


                data: {


                    labels:
                        labels,


                    datasets: [


                        {

                            label:
                                "YoY",

                            data:
                                yoyValues,

                            tension:
                                0.2,

                            pointRadius:
                                1.5,

                            pointHoverRadius:
                                5,

                            spanGaps:
                                true

                        },


                        {

                            label:
                                "MoM",

                            data:
                                momValues,

                            tension:
                                0.2,

                            pointRadius:
                                1.5,

                            pointHoverRadius:
                                5,

                            spanGaps:
                                true,

                            borderDash:
                                [5, 5]

                        }


                    ]


                },


                options: {


                    responsive:
                        true,


                    maintainAspectRatio:
                        false,


                    interaction: {

                        mode:
                            "index",

                        intersect:
                            false

                    },


                    plugins: {


                        legend: {

                            position:
                                "top"

                        },


                        tooltip: {


                            callbacks: {


                                label:
                                    function(
                                        context
                                    ) {


                                        if (
                                            context
                                            .parsed
                                            .y
                                            ===
                                            null
                                        ) {


                                            return "";


                                        }


                                        const value =
                                            context
                                            .parsed
                                            .y;


                                        return (
                                            context
                                            .dataset
                                            .label
                                            +
                                            ": "
                                            +
                                            (
                                                value
                                                >
                                                0
                                                ?
                                                "+"
                                                :
                                                ""
                                            )
                                            +
                                            value
                                            .toFixed(1)
                                            +
                                            "%"
                                        );


                                    }


                            }


                        }


                    },


                    scales: {


                        y: {


                            title: {

                                display:
                                    true,

                                text:
                                    "증감률 (%)"

                            },


                            ticks: {


                                callback:
                                    function(
                                        value
                                    ) {


                                        return (
                                            value
                                            +
                                            "%"
                                        );


                                    }


                            }


                        },


                        x: {


                            grid: {

                                display:
                                    false

                            },


                            ticks: {

                                maxRotation:
                                    45,

                                minRotation:
                                    45,

                                autoSkip:
                                    true,

                                maxTicksLimit:
                                    24

                            }


                        }


                    }


                }


            }
        );

}



loadCSV();


</script>


</body>

</html>
